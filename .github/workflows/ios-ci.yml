name: iOS
on:
  push:
    branches: [main, 'build/**']
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Build app and keyboard for iOS Simulator
        run: |
          xcodebuild -project ios/ReaxKey.xcodeproj -scheme ReaxKey \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Package editable iOS project
        run: zip -r -q reaxkey-ios-project.zip ios -x 'ios/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: reaxkey-ios-project-source
          path: reaxkey-ios-project.zip
