name: Android
on:
  push:
    branches: [main, 'build/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test lint assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: reaxkey-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            testbed/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: reaxkey-unsigned-release-bundle
          path: app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: '**/build/reports/'
